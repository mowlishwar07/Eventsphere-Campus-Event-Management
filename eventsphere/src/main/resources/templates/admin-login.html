<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - EventSphere</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="form-page">
    <div class="form-container">
        <div class="form-logo" style="background: linear-gradient(135deg, #f59e0b, #ef4444);">A</div>

        <h1>Admin Portal</h1>
        <h2>Sign in with organizer credentials</h2>

        <div class="alert alert-error" th:if="${error}">
            <span>⚠</span> <span th:text="${error}"></span>
        </div>

        <form action="/admin/login" method="post">
            <div class="form-group">
                <label for="adminEmail">Admin Email</label>
                <input
                    id="adminEmail"
                    type="email"
                    name="email"
                    placeholder="admin@eventsphere.com"
                    autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label for="adminPassword">Password</label>
                <input
                    id="adminPassword"
                    type="password"
                    name="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit" class="btn" style="background: linear-gradient(135deg, #f59e0b, #ea580c);">
                Enter Admin Dashboard
            </button>
        </form>

        <div class="form-footer-links">
            <p>
                Student account? <a href="/login">Student Login</a>
            </p>
            <p>
                <a href="/">← Return to Home</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
